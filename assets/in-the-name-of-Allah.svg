<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1400 400"
     width="1400"
     height="400">

  <defs>

    <!-- Metallic silver -->
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#777777"/>
      <stop offset="25%"  stop-color="#eeeeee"/>
      <stop offset="50%"  stop-color="#a8a8a8"/>
      <stop offset="75%"  stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#858585"/>
    </linearGradient>

    <!-- Soft glow -->
    <filter id="glow"
            x="-30%" y="-50%"
            width="160%" height="200%">

      <feGaussianBlur
        in="SourceGraphic"
        stdDeviation="5"
        result="blur"/>

      <feFlood
        flood-color="#ffffff"
        flood-opacity="0.22"
        result="glowColor"/>

      <feComposite
        in="glowColor"
        in2="blur"
        operator="in"
        result="glow"/>

      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <!-- Subtle depth / shadow -->
    <filter id="depth"
            x="-20%" y="-40%"
            width="140%" height="180%">

      <feGaussianBlur
        in="SourceAlpha"
        stdDeviation="4"
        result="shadow"/>

      <feOffset
        dx="0"
        dy="6"
        result="offsetShadow"/>

      <feFlood
        flood-color="#000000"
        flood-opacity="0.65"
        result="shadowColor"/>

      <feComposite
        in="shadowColor"
        in2="offsetShadow"
        operator="in"
        result="finalShadow"/>

      <feMerge>
        <feMergeNode in="finalShadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>

  <text
    x="700"
    y="250"
    text-anchor="middle"
    direction="rtl"
    unicode-bidi="bidi-override"

    font-family="'Aref Ruqaa', 'Amiri', 'Noto Naskh Arabic', serif"
    font-size="115"
    font-weight="400"

    fill="url(#silver)"

    filter="url(#depth)">

    بسم الله الرحمن الرحيم

  </text>

</svg>