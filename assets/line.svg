<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 40" role="img" aria-label="Decorative gradient line" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
